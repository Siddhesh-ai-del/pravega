name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pravega
          SESSION_SECRET: ci-only-secret-not-for-production
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next
          retention-days: 3

  e2e:
    name: Golden Flow (Playwright)
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pravega
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pravega
          SESSION_SECRET: ci-only-secret-not-for-production
      - run: npx playwright install --with-deps chromium
      - name: Push schema & seed
        run: |
          npx drizzle-kit push --force
          npx tsx db/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pravega
          SESSION_SECRET: ci-only-secret-not-for-production
      - name: Run golden flow (3×)
        run: npx playwright test --repeat-each=3
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pravega
          SESSION_SECRET: ci-only-secret-not-for-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
