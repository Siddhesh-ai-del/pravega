<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Pravega mark">
  <title>Pravega mark</title>
  <desc>Bold Brutalist Ledger mark: hard-edged square with diagonal cut and hazard-orange wedge, containing a stamped "P".</desc>

  <!-- Black square base -->
  <rect x="0" y="0" width="120" height="120" fill="#0A0A0A"/>
  <!-- Hazard-orange wedge (diagonal cut from top-right to bottom-left) -->
  <polygon points="120,0 120,120 0,120" fill="#FF4A00"/>
  <!-- Concrete inner square -->
  <rect x="16" y="16" width="88" height="88" fill="#D6D3CC"/>
  <!-- Black inner mark: hard-edged "P" stamp -->
  <rect x="34" y="34" width="14" height="52" fill="#0A0A0A"/>
  <rect x="34" y="34" width="42" height="14" fill="#0A0A0A"/>
  <rect x="62" y="34" width="14" height="28" fill="#0A0A0A"/>
  <rect x="34" y="48" width="42" height="14" fill="#0A0A0A"/>
</svg>
